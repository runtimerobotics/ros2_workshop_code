name: build and test

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.distro }} (Ubuntu ${{ matrix.ubuntu }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: jazzy
            ubuntu: "24.04"
          - distro: lyrical
            ubuntu: "26.04"
    runs-on: ubuntu-24.04
    container: osrf/ros:${{ matrix.distro }}-desktop-full
    env:
      ROS_DISTRO: ${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get upgrade -y        # the image can be older than the newest ROS packages
          apt-get install -y --no-install-recommends \
            ros-${ROS_DISTRO}-ros-gz ros-${ROS_DISTRO}-gz-ros2-control \
            ros-${ROS_DISTRO}-ros2-control ros-${ROS_DISTRO}-ros2-controllers \
            ros-${ROS_DISTRO}-moveit ros-${ROS_DISTRO}-moveit-py ros-${ROS_DISTRO}-pick-ik \
            ros-${ROS_DISTRO}-realsense2-description ros-${ROS_DISTRO}-cv-bridge python3-opencv
          source /opt/ros/${ROS_DISTRO}/setup.bash
          rosdep update
          rosdep install --from-paths ros2_ws/src --ignore-src -y

      - name: Basics (shell, Python, C++)
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash     # 03_callbacks.py imports std_msgs
          bash 00_linux_basics/navigate_exercise.sh > /dev/null
          bash 00_linux_basics/scripts/hello.sh CI 2
          for f in 01_python_basics/0[1-4]_*.py; do python3 "$f"; done
          python3 01_python_basics/solutions/05_exercise_turtle_path.py
          cd 02_cpp_cmake_basics/02_robot_lib
          cmake -S . -B build && cmake --build build && (cd build && ctest --output-on-failure)

      - name: Build
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          cd ros2_ws && colcon build --symlink-install --event-handlers console_cohesion+

      - name: Test
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          cd ros2_ws && colcon test && colcon test-result --verbose

      - name: Smoke-run the examples
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source ros2_ws/install/setup.bash
          bash ros2_ws/scripts/smoke_test.sh
