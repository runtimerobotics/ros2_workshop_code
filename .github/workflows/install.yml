name: install scripts

# Run setup/install_*.sh on a plain Ubuntu, the way a student does, then follow the
# README's setup steps. Weekly as well, because new ROS packages can break an install.
on:
  push:
    paths: ['setup/**', '.github/workflows/install.yml']
  pull_request:
    paths: ['setup/**', '.github/workflows/install.yml']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  install:
    name: ${{ matrix.script }} on Ubuntu ${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "24.04"
            script: install_jazzy.sh
          - ubuntu: "26.04"
            script: install_lyrical.sh
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    env:
      DEBIAN_FRONTEND: noninteractive
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # avoids the API rate limit on shared runners
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: A bare Ubuntu with sudo, like a fresh laptop
        run: |
          apt-get update && apt-get install -y sudo
          echo 'Defaults env_keep += "DEBIAN_FRONTEND"' > /etc/sudoers.d/frontend

      - name: Run the install script
        run: bash setup/${{ matrix.script }}

      - name: check_setup.sh
        run: bash setup/check_setup.sh

      - name: Build and test the workspace (README "Setup")
        run: |
          source /opt/ros/*/setup.bash
          cd ros2_ws
          rosdep install --from-paths src -y --ignore-src
          colcon build --symlink-install
          colcon test && colcon test-result --verbose
