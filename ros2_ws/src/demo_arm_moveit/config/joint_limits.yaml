# Velocity and acceleration limits used when MoveIt adds timing to a path.
# Scaling factors below 1 slow everything down: a good default for a classroom.
default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

joint_limits:
  joint1: {has_velocity_limits: true, max_velocity: 1.5, has_acceleration_limits: true, max_acceleration: 3.0}
  joint2: {has_velocity_limits: true, max_velocity: 1.5, has_acceleration_limits: true, max_acceleration: 3.0}
  joint3: {has_velocity_limits: true, max_velocity: 1.5, has_acceleration_limits: true, max_acceleration: 3.0}
  joint4: {has_velocity_limits: true, max_velocity: 2.0, has_acceleration_limits: true, max_acceleration: 4.0}
  joint5: {has_velocity_limits: true, max_velocity: 2.5, has_acceleration_limits: true, max_acceleration: 5.0}
  left_finger_joint: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 0.5}
  right_finger_joint: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 0.5}
