# Inverse kinematics for the arm group.
# pick_ik handles arms with fewer than six joints well: this one has five, so it cannot
# reach every orientation, but it reaches "tool pointing down, any yaw", which is all a
# top-down grasp needs. (KDL, MoveIt's default, often fails on such arms.)
arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  mode: global
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.001
  orientation_threshold: 0.01
  cost_threshold: 0.001
  minimal_displacement_weight: 0.0
  gd_step_size: 0.0001
